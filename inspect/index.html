<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#164698">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vehicle Inspection – Compton Tankers</title>
<style>
:root{--brand:#164698;--accent:#E3641D;--accent2:#FFB27F;--tint:#FFF1E8;--ok:#1f8a4c;--bad:#c0392b;--warn:#b25a12;--bg:#EEF3FA;--card:#fff;--ink:#16202D;--muted:#5d6b7a;--line:#dde3ea;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.45 Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--accent)}
.hrow{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.logo{height:46px;max-width:200px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
.wordmark{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.6px;font-size:23px;text-transform:uppercase;line-height:1}
.wordmark span{color:var(--accent)}
.hsub{margin-left:auto;font-size:13px;opacity:.85;text-align:right}
.prog{max-width:720px;margin:10px auto 0;height:8px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stepinfo{max-width:720px;margin:7px auto 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
#stepsec{background:var(--accent);color:#fff;font-weight:700;padding:2px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;font-size:12px}
main{max-width:720px;margin:0 auto;padding:16px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(22,70,152,.10);margin-bottom:14px;border-top:5px solid var(--brand)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;color:var(--brand);letter-spacing:.2px}
h1{font-size:30px;margin:0 0 6px;line-height:1.05}
h2{font-size:26px;margin:0 0 6px;line-height:1.1}
h3{font-size:19px;margin:18px 0 8px;color:var(--accent)}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tip{background:var(--tint);border-left:5px solid var(--accent);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-family:inherit;font-size:16.5px;font-weight:700;cursor:pointer;text-decoration:none;min-height:52px;background:#e7ebf0;color:var(--ink);-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--brand);color:#fff}
.btn.accent{background:var(--accent);color:#fff;box-shadow:0 3px 0 #b44d14}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.btn.block{display:flex;width:100%}
.btn.link{background:none;color:var(--brand);padding:8px 4px;min-height:0;font-weight:600;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.navbar .btn.back{background:rgba(255,255,255,.14);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns>.btn{flex:1 1 140px}
.field{margin:14px 0}
.field>label{display:block;font-weight:650;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:-2px 0 6px}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,100,29,.18)}
input:disabled,select:disabled{background:#f0f2f5;color:#999}
.unit{color:var(--muted);font-size:14px;white-space:nowrap}
.unitsel{width:auto;min-width:90px}
.na{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:6px;font-weight:400}
.na input{width:18px;height:18px}
.err{background:#fdecea;color:var(--bad);padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600;font-size:14.5px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare figure{margin:0;background:#f6f8fa;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.compare figcaption{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#fff;padding:6px 8px;background:var(--brand)}
.compare figure+figure figcaption{background:var(--accent)}
.compare img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e9edf1}
.guide{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#fff}
.guide svg{width:100%;height:100%}
.empty{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#9aa6b2;font-size:13px;text-align:center;padding:8px}
@media(max-width:300px){.compare{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:#eef1f4;font-weight:600}
.chip.ok{background:#e3f4ea;color:var(--ok)}
.chip.warn{background:#fff3dc;color:var(--warn)}
.chip.bad{background:#fdecea;color:var(--bad)}
.question{background:#f6f8fa;border-radius:10px;padding:12px;margin-top:10px;font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:10px}
.status.ok{color:var(--ok)}
.status.skip{color:var(--warn)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--brand);border-top:4px solid var(--accent);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.navbar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{flex:1}
.navbar .btn.back{flex:0 0 110px}
.list{list-style:none;padding:0;margin:8px 0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:#cfd6de}
.dot.ok{background:var(--ok)}.dot.skip{background:var(--warn)}.dot.bad{background:var(--bad)}
.thumb{width:54px;height:42px;border-radius:6px;object-fit:cover;background:#e9edf1;flex:0 0 54px}
.linkbox{word-break:break-all;background:#f6f8fa;border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typebtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font:inherit;font-weight:650;cursor:pointer;min-height:58px;color:var(--ink)}
.typebtn.on{border-color:var(--accent);background:var(--tint);color:var(--brand)}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.seg .btn.on{background:var(--accent);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--brand)}
table.t input{min-height:44px;padding:8px}
footer{font-size:12px;color:var(--brand);font-weight:600;text-align:center;padding:10px 14px 0;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
.hidden{display:none!important}
.big{font-size:56px;line-height:1;color:var(--accent)}
.spin{width:36px;height:36px;border:4px solid #dde3ea;border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:10px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="hrow"><div id="brandmark"></div><div class="hsub" id="hsub"></div></div>
  <div class="prog hidden" id="prog"><i id="progbar"></i></div>
  <div class="stepinfo hidden" id="stepinfo"><span id="stepsec"></span><span id="stepnum"></span></div>
</header>
<main id="app"></main>
<div class="navbar hidden" id="navbar"><div class="in">
  <button class="btn back" id="backbtn" onclick="back()">‹ Back</button>
  <button class="btn back" id="skipbtn" onclick="skipStep()" style="flex:.8">Skip ›»</button>
  <button class="btn accent" id="nextbtn" onclick="next()">Next ›</button>
</div></div>
<div class="toast" id="toast"></div>

const DB = {
  db:null, mem:{},
  async open(){ try{ this.db = await new Promise((res,rej)=>{ const r=indexedDB.open("compton-inspect",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ this.db=null; } },
  async get(k){ if(k in this.mem) return this.mem[k]; if(!this.db) return undefined; return new Promise(res=>{ try{ const r=this.db.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>{this.mem[k]=r.result;res(r.result)}; r.onerror=()=>res(undefined);}catch(e){res(undefined)} }); },
  async set(k,v){ this.mem[k]=v; if(!this.db) return; return new Promise(res=>{ try{ const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res()} }); },
  async del(k){ delete this.mem[k]; if(!this.db) return; return new Promise(res=>{ try{ const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res()} }); }
};

const CLOUD_CFG={url:"https://swqpnumuqtsgwpqowxid.supabase.co",key:"sb_publishable_n25KLWM-u9E0t6whfWMgew_uYWquUJT"};
let CLOUD=null, syncT=null;
async function rpc(fn,body){
  const r=await fetch(CLOUD_CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CLOUD_CFG.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message||"Request failed");
  return j;
}
function dataToBlob(d){ return new Blob([dataToU8(d)],{type:"image/jpeg"}); }
async function putFile(path,blob,type){
  const r=await fetch(CLOUD_CFG.url+"/storage/v1/object/inspections/"+path,{method:"POST",headers:{apikey:CLOUD_CFG.key,"Content-Type":type,"x-upsert":"false"},body:blob});
  if(!r.ok) throw new Error("upload "+r.status);
}
async function cloudUpload(key){
  if(!CLOUD||!S) return true;
  S.up=S.up||{}; if(S.up[key]) return true;
  const d=PCACHE[key]||await DB.get(`photo|${JOB.id}|${key}`); if(!d) return false;
  const path=`${CLOUD.id}/${key}_${Date.now().toString(36)}.jpg`;
  try{ await putFile(path,dataToBlob(d),"image/jpeg"); S.up[key]=path; save(); return true; }catch(e){ return false; }
}

}

    if(sec==="Walkaround photos") STEPS.push({kind:"video",section:"Walkaround video"}); }

  for(const g of GROUPS){ const ids=Object.keys(FIELDS).filter(k=>fset.has(k)&&FIELDS[k].group===g); for(let i=0;i<ids.length;i+=6) STEPS.push({kind:"fields",ids:ids.slice(i,i+6),section:g}); }

const PCACHE={};
function chipsHTML(a){ if(!a) return ""; const c=[]; if(a.dark) c.push(`<span class="chip warn">Looks dark</span>`); if(a.bright) c.push(`<span class="chip warn">Looks over-exposed</span>`); if(a.blurry) c.push(`<span class="chip warn">May be blurry</span>`); if(a.portrait) c.push(`<span class="chip warn">Portrait – turn phone sideways</span>`); if(!c.length) c.push(`<span class="chip ok">Auto-check: light and focus look OK</span>`); return `<div class="chips">${c.join("")}</div>`; }

async function onPhoto(key,inp){

async function compress(file,max){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); return c.toDataURL("image/jpeg",0.82); }
  finally{ URL.revokeObjectURL(url); }
}
async function analyse(src){
  const img=await loadImg(src), w=200, h=Math.max(2,Math.round(200*img.height/img.width));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data, g=new Float32Array(w*h); let sum=0;
  for(let i=0;i<w*h;i++){ const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]; g[i]=v; sum+=v; }
  const mean=sum/(w*h); let ls=0,lq=0,n=0;
  for(let y=1;y<h-1;y++) for(let xx=1;xx<w-1;xx++){ const i=y*w+xx, l=g[i-1]+g[i+1]+g[i-w]+g[i+w]-4*g[i]; ls+=l; lq+=l*l; n++; }
  const sharp=lq/n-(ls/n)**2;
  return {mean:Math.round(mean),sharp:Math.round(sharp),landscape:img.width>=img.height,dark:mean<55,bright:mean>225,blurry:sharp<40};
}

    <div class="row">${inp}${unit}</div>${f.optional?"":`<label class="na"><input type="checkbox" ${isNA?"checked":""} ${isEX?"disabled":""} onchange="toggleNA('${id}',this.checked)"> Not available / can't check</label>${f.type==="date"?`<label class="na"><input type="checkbox" ${isEX?"checked":""} ${isNA?"disabled":""} onchange="toggleEXP('${id}',this.checked)"> Expired</label>`:""}`}</div>`;
}
function rFields(st){ return `<div class="card"><h2>${esc(st.section)}</h2>${st.ids.map(fieldHTML).join("")}<div id="steperr"></div></div>`; }

/* ---------- step: compartments ---------- */
function rComp(){
  const a=S.answers, n=parseInt(a.comp_count)||0, sizes=a.comp_sizes||[];

    <div class="field"><label>Number of compartments</label><select onchange="setA('comp_count',this.value);render()"><option value="">Select…</option>${[1,2,3,4,5,6,7,8].map(i=>`<option ${n===i?"selected":""}>${i}</option>`).join("")}</select></div>
    ${n?`<table class="t"><tr><th>Compartment</th><th>Size (litres)</th></tr>${Array.from({length:n},(_,i)=>`<tr><td>${i+1}${i===0?" (front)":""}</td><td><input type="number" inputmode="decimal" value="${esc(sizes[i]||"")}" oninput="setComp(${i},this.value)"></td></tr>`).join("")}
      <tr><th>Total</th><th id="comptotal">${total.toLocaleString("en-GB")} L</th></tr></table>
      ${plated&&total&&Math.abs(total-plated)>plated*0.02?`<div class="tip">Total doesn't match the plated capacity (${plated.toLocaleString("en-GB")} L). Double-check if you can.</div>`:""}`:""}
    <div id="steperr"></div></div>`;
}
function setComp(i,v){ const s=S.answers.comp_sizes||[]; s[i]=v; S.answers.comp_sizes=s; save(); const n=parseInt(S.answers.comp_count)||0; const t=s.slice(0,n).reduce((a,b)=>a+(parseFloat(b)||0),0); const el=$("comptotal"); if(el) el.textContent=t.toLocaleString("en-GB")+" L"; }

/* ---------- step: tread ---------- */
function axleCount(){ return AXLES[S.answers.axle_layout]||parseInt(S.answers.tread_axles)||0; }
function rTread(){
  const n=axleCount(), t=S.answers.tread||{};
  const pick=!AXLES[S.answers.axle_layout]?`<div class="field"><label>How many axles?</label><div class="hint">Axle layout wasn't set earlier.</div><select onchange="setA('tread_axles',this.value);render()"><option value="">Select…</option>${[1,2,3,4,5].map(i=>`<option ${n===i?"selected":""}>${i}</option>`).join("")}</select></div>`:"";
  return `<div class="card"><h2>Tyre tread depths</h2><p class="muted">Measure each tyre in mm. On twin wheels, measure the outer tyre and note anything odd on the inner in damage &amp; defects.</p>${pick}
    ${n?`<table class="t"><tr><th>Axle</th><th>Passenger side (mm)</th><th>Driver side (mm)</th></tr>${Array.from({length:n},(_,i)=>{ const k=i+1, r=t[k]||{}; return `<tr><td>${k}${k===1?" (front)":""}</td><td><input type="number" inputmode="decimal" step="0.1" value="${esc(r.ns||"")}" oninput="setTread(${k},'ns',this.value)"></td><td><input type="number" inputmode="decimal" step="0.1" value="${esc(r.os||"")}" oninput="setTread(${k},'os',this.value)"></td></tr>`; }).join("")}</table>`:""}
    <div id="treadwarn"></div><div id="steperr"></div></div>`;
}
function setTread(ax,side,v){ const t=S.answers.tread||{}; t[ax]=t[ax]||{}; t[ax][side]=v; S.answers.tread=t; save();
  const low=Object.values(t).some(r=>["ns","os"].some(s=>r[s]!==""&&r[s]!=null&&parseFloat(r[s])<MIN_TREAD)); const w=$("treadwarn"); if(w) w.innerHTML=low?`<div class="err">One or more tyres are below ${MIN_TREAD} mm – please double-check and note it in defects.</div>`:""; }

/* ---------- step: defects ---------- */
function rDefects(){
  const list=S.defects||[];
  return `<div class="card"><h2>Damage &amp; defects</h2><p class="muted">Photograph anything a buyer should know about – dents, corrosion, leaks, warning lights, damaged tyres. Add as many as you need. If there's nothing, just tap Next.</p>
    ${list.map((d,i)=>`<div class="card" style="background:#f6f8fa;box-shadow:none"><div class="row"><img class="thumb" id="dthumb${i}" alt=""><b class="grow">Defect ${i+1}</b><button class="btn link" style="color:var(--bad)" onclick="delDefect(${i})">Remove</button></div>
      <div class="field"><textarea placeholder="Describe it – where on the vehicle, how bad" oninput="S.defects[${i}].note=this.value;save()">${esc(d.note||"")}</textarea></div></div>`).join("")}
    <label class="btn accent block">📷 Add a defect photo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="addDefect(this)"></label>
    <div class="field"><label>Any other comments <span class="opt">(optional)</span></label><textarea oninput="setA('comments',this.value)">${esc(S.answers.comments||"")}</textarea></div>
    <div id="steperr"></div></div>`;
}
function hydrateDefectThumbs(){ (S.defects||[]).forEach(async (d,i)=>{ const v=PCACHE[d.key]||await DB.get(`photo|${JOB.id}|${d.key}`); if(v){ PCACHE[d.key]=v; const el=$("dthumb"+i); if(el) el.src=v; } }); }
async function addDefect(inp){ const f=inp.files[0]; if(!f) return; const d=await compress(f,1600), key="defect_"+Date.now().toString(36); PCACHE[key]=d; await DB.set(`photo|${JOB.id}|${key}`,d); S.defects=S.defects||[]; S.defects.push({key,note:""}); save(); render(); cloudUpload(key); }
async function delDefect(i){ const d=S.defects[i]; await DB.del(`photo|${JOB.id}|${d.key}`); S.defects.splice(i,1); save(); render(); }

/* ---------- validation ---------- */
function filled(v){ return v!=null&&String(v).trim()!==""; }
function validate(st){
  const a=S.answers; if(S.skips&&S.skips[st.kind]&&(st.kind==="compartments"||st.kind==="tread")) return "";
  if(st.kind==="intro"){ if(!filled(a.inspector)) return "Please enter your name."; if(!a.reg_match) return "Please confirm the registration / ID."; if(a.reg_match==="No"&&!filled(a.actual_reg)) return "Please enter what the vehicle shows."; }
  if(st.kind==="video"&&!S.video) return "Record the walkaround video, or say why you can't.";
  if(st.kind==="photo"){ const p=S.photos[st.key]; if(!p||(p.status!=="ok"&&p.status!=="skipped")) return "Take the photo and confirm it, or say why you can't."; }
  if(st.kind==="fields"){ const miss=st.ids.filter(id=>!FIELDS[id].optional&&!filled(a[id])).map(id=>FIELDS[id].label); if(miss.length) return "Please complete: "+miss.join(", ")+". If you can't check something, tick “Not available”."; }
  if(st.kind==="compartments"){ const n=parseInt(a.comp_count)||0; if(!n) return "Select the number of compartments."; if((a.comp_sizes||[]).slice(0,n).filter(filled).length<n) return "Enter a size for every compartment (put 0 if unknown and add a comment)."; }
  if(st.kind==="tread"){ const n=axleCount(); if(!n) return "Select the number of axles."; const t=a.tread||{}; for(let k=1;k<=n;k++){ if(!filled(t[k]?.ns)||!filled(t[k]?.os)) return "Enter a tread depth for every tyre."; } }
  if(st.kind==="review"){ const m=missing(); if(m.length) return "Some steps aren't finished – see the list above."; }
  return "";
}
function missing(){ const out=[]; STEPS.forEach((st,i)=>{ if(st.kind!=="review"&&validate(st)) out.push(i); }); return out; }

/* ---------- step: review ---------- */
function rReview(){
  const m=missing(), photoSteps=STEPS.map((s,i)=>[s,i]).filter(([s])=>s.kind==="photo");
  const ok=photoSteps.filter(([s])=>S.photos[s.key]?.status==="ok").length, sk=photoSteps.filter(([s])=>S.photos[s.key]?.status==="skipped").length;
  setTimeout(hydrateReviewThumbs);
  return `<div class="card"><h2>Check &amp; send</h2>
    <div class="chips"><span class="chip ok">${ok} photos accepted</span>${sk?`<span class="chip warn">${sk} skipped</span>`:""}<span class="chip">${(S.defects||[]).length} defects</span>${m.length?`<span class="chip bad">${m.length} to finish</span>`:`<span class="chip ok">All steps complete</span>`}</div>
    ${m.length?`<h3>Still to do</h3><ul class="list">${m.map(i=>`<li><span class="dot bad"></span><div class="grow">${esc(stepName(STEPS[i]))}</div><button class="btn link" onclick="goto(${i})">Go ›</button></li>`).join("")}</ul>`:""}
    <h3>Photos</h3><ul class="list">${photoSteps.map(([s,i])=>{ const p=S.photos[s.key]; return `<li><img class="thumb" data-k="${s.key}" alt=""><span class="dot ${p?.status==="ok"?"ok":p?.status==="skipped"?"skip":"bad"}"></span><div class="grow">${esc(stepName(s))}${p?.status==="skipped"?`<div class="small muted">Skipped: ${esc(p.reason)}</div>`:""}</div><button class="btn link" onclick="goto(${i})">Edit</button></li>`; }).join("")}</ul>
    <h3>Walkaround video</h3><ul class="list"><li><span class="dot ${S.video?.status==="ok"?"ok":S.video?.status==="skipped"?"skip":"bad"}"></span><div class="grow">${S.video?.status==="ok"?`Recorded (${(S.video.size/1048576).toFixed(0)} MB)`:S.video?.status==="skipped"?`Skipped: ${esc(S.video.reason)}`:"Not recorded"}</div><button class="btn link" onclick="goto(${STEPS.findIndex(s=>s.kind==="video")})">Edit</button></li></ul>
    <h3>Details</h3><table class="t">${specRows().map(([g,l,v])=>`<tr><td class="muted small">${esc(l)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    <p class="small muted" style="margin-top:14px">${CLOUD?"Tapping <b>Finish &amp; send</b> sends everything straight to the office.":`Tapping <b>Finish &amp; send</b> packs everything into one file (photos + report) for you to send to ${esc(BRAND.shortName)}.`}</p>
    <div id="steperr"></div><div id="sendout"></div></div>`;
}
function hydrateReviewThumbs(){ document.querySelectorAll("img[data-k]").forEach(async el=>{ const k=el.dataset.k; const v=PCACHE[k]||await DB.get(`photo|${JOB.id}|${k}`); if(v){ PCACHE[k]=v; el.src=v; } }); }
function stepName(s){ if(s.kind==="photo"){ const d=PHOTOS[s.slot]; return d.label+(s.n>1?` ${s.i} – ${d.subs?.[s.i-1]||""}`:""); } if(s.kind==="fields") return s.section; return {intro:"Your name & registration",video:"Walkaround video",compartments:"Compartments and sizes",tread:"Tyre tread depths",defects:"Damage & defects"}[s.kind]||s.section; }

/* ---------- output ---------- */
function fmtVal(id){ const f=FIELDS[id], v=S.answers[id]; if(!filled(v)) return ""; if(v==="N/A") return "Not available"; if(v==="Expired") return "EXPIRED"; if(f.type==="date") return fmtDate(v); if(f.units) return `${Number(v).toLocaleString("en-GB")} ${S.answers[id+"_unit"]||f.units[0]}`; if(f.unit) return `${f.type==="number"?Number(v).toLocaleString("en-GB"):v} ${f.unit}`; return String(v); }
function specRows(){
  const a=S.answers, t=TYPES[JOB.type], fset=fieldSet(), rows=[];
  rows.push(["Job","Registration / ID",JOB.reg]); if(a.reg_match==="No") rows.push(["Job","Vehicle actually shows",a.actual_reg||""]);
  rows.push(["Job","Vehicle type",t.label]); if(JOB.stock) rows.push(["Job","Stock ref",JOB.stock]); if(JOB.where) rows.push(["Job","Location",JOB.where]);
  rows.push(["Job","Inspector",a.inspector||""]); rows.push(["Job","Inspection date",fmtDate(today())]);
  for(const g of GROUPS) for(const id of Object.keys(FIELDS).filter(k=>fset.has(k)&&FIELDS[k].group===g)) rows.push([g,FIELDS[id].label,fmtVal(id)]);
  if(fset.has("compartments")){ const n=parseInt(a.comp_count)||0, s=(a.comp_sizes||[]).slice(0,n); rows.push(["Tank & equipment","Number of compartments",n?String(n):""]); if(n&&!(S.skips&&S.skips.compartments)) rows.push(["Tank & equipment","Compartment sizes (front to rear)",s.map(x=>Number(x).toLocaleString("en-GB")+" L").join(" / ")+` = ${s.reduce((x,y)=>x+(parseFloat(y)||0),0).toLocaleString("en-GB")} L`]); }
  if(fset.has("tread")){ const n=axleCount(), tr=a.tread||{}; for(let k=1;k<=n;k++) rows.push(["Tyres",`Axle ${k} tread (passenger / driver)`,S.skips&&S.skips.tread?"Skipped":`${tr[k]?.ns??""} mm / ${tr[k]?.os??""} mm`]); }
  rows.push(["Walkaround video","Walkaround video",S.video?.status==="ok"?"Included in pack (videos folder)":S.video?.status==="skipped"?"Not recorded: "+S.video.reason:"Not recorded"]);
  if(filled(a.comments)) rows.push(["Comments","Inspector comments",a.comments]);
  return rows;
}
function safeName(s){ return String(s).replace(/[^A-Za-z0-9_-]+/g,"_"); }
async function submitZip(){
  const out=$("sendout"); out.innerHTML=`<div class="spin"></div><p class="muted small" style="text-align:center">Building your inspection pack…</p>`; $("nextbtn").disabled=true;
  try{
    const files=[], photoList=[]; let n=0;
    for(const st of STEPS.filter(s=>s.kind==="photo")){ const p=S.photos[st.key]; const label=stepName(st);
      if(p?.status==="ok"){ const d=PCACHE[st.key]||await DB.get(`photo|${JOB.id}|${st.key}`); if(d){ n++; const name=`photos/${String(n).padStart(2,"0")}_${st.key}.jpg`; files.push({name,data:dataToU8(d)}); photoList.push({label,name,data:d,auto:p.auto}); } }
      else photoList.push({label,skipped:p?.reason||"Not taken"}); }
    for(const [i,df] of (S.defects||[]).entries()){ const d=PCACHE[df.key]||await DB.get(`photo|${JOB.id}|${df.key}`); if(d){ n++; const name=`photos/${String(n).padStart(2,"0")}_defect_${i+1}.jpg`; files.push({name,data:dataToU8(d)}); photoList.push({label:`Defect ${i+1}`,note:df.note,name,data:d,defect:1}); } }
    if(S.video?.status==="ok"){ const vb=await DB.get("video|"+JOB.id); if(vb){ const ext=((S.video.name.match(/\.([a-z0-9]+)$/i)||[])[1]||(S.video.type.includes("quicktime")?"mov":"mp4")).toLowerCase(); files.push({name:`videos/walkaround.${ext}`,data:new Uint8Array(await vb.arrayBuffer())}); } }
    const rows=specRows(), enc=new TextEncoder();
    files.unshift({name:"report.html",data:enc.encode(reportHTML(rows,photoList))});
    files.push({name:"data.csv",data:enc.encode("﻿"+[["Section","Item","Value"],...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n"))});
    files.push({name:"data.json",data:enc.encode(JSON.stringify({job:JOB,answers:S.answers,photos:S.photos,defects:(S.defects||[]).map(d=>({note:d.note})),submitted:new Date().toISOString()},null,2))});
    const zip=makeZip(files), fname=`Inspection_${safeName(JOB.reg)}_${today()}.zip`;
    S.submitted=new Date().toISOString(); save();
    await deliver(zip,fname,out,true);
  }catch(e){ out.innerHTML=`<div class="err">Something went wrong building the pack. Please try again.</div>`; }
  $("nextbtn").disabled=false;
}
async function submit(){
  if(!CLOUD) return submitZip();
  const out=$("sendout"); out.innerHTML=`<div class="spin"></div><p class="muted small" style="text-align:center">Sending to the office…</p>`; $("nextbtn").disabled=true;
  try{
    S.up=S.up||{}; const failed=[];
    for(const st of STEPS.filter(x=>x.kind==="photo"&&S.photos[x.key]?.status==="ok")) if(!(await cloudUpload(st.key))) failed.push(st.key);
    for(const d of (S.defects||[])) if(!(await cloudUpload(d.key))) failed.push(d.key);
    if(S.video?.status==="ok"&&!S.up.video&&S.video.size<=48*1048576){ const v=await DB.get("video|"+JOB.id); if(v) await cloudVideo(v); }
    if(failed.length){ out.innerHTML=`<div class="err">${failed.length} photo(s) didn't upload – check your signal and press Finish &amp; send again.</div>`; $("nextbtn").disabled=false; return; }
    const photos=STEPS.filter(x=>x.kind==="photo").map(st=>({key:st.key,label:stepName(st),status:S.photos[st.key]?.status||"missing",reason:S.photos[st.key]?.reason||"",path:S.up[st.key]||null}));
    const defects=(S.defects||[]).map((d,i)=>({key:d.key,note:d.note||"",path:S.up[d.key]||null}));
    const data={state:S,up:S.up,rows:specRows(),photos,defects,video:S.video?{status:S.video.status,reason:S.video.reason||"",path:S.up.video||null,note:S.video.cloud||""}:null,submitted:new Date().toISOString()};
    await rpc("pub_save_job",{p_job:CLOUD.id,p_data:data,p_submit:true});
    S.submitted=new Date().toISOString(); DB.set("state|"+JOB.id,S);
    chrome(false);
    $("app").innerHTML=`<div class="card" style="text-align:center"><div class="big">✓</div><h1>Sent to the office</h1><p>Thank you. The inspection for <b>${esc(JOB.reg)}</b> has been sent – you can close this page.</p></div>
      <div class="card"><p class="small muted">Want a copy for yourself? You can also download the whole inspection as a file.</p><button class="btn block" id="zipbtn">Download a copy</button><div id="sendout"></div></div>${footerHTML()}`;
    $("zipbtn").onclick=()=>{ const t=CLOUD; CLOUD=null; submitZip().finally(()=>{CLOUD=t;}); };
  }catch(e){ out.innerHTML=`<div class="err">Couldn't send: ${esc(e.message)}. Check your signal and try again.</div>`; $("nextbtn").disabled=false; }
}
async function deliver(blob,fname,box,isJob){
  const file=new File([blob],fname,{type:"application/zip"});
  const mb=(blob.size/1048576).toFixed(1);
  const dl=URL.createObjectURL(blob);
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  box.innerHTML=`<div class="tip"><b>${isJob?"Inspection pack ready":"Pack ready"}</b> – ${esc(fname)} (${mb} MB)</div>
    ${canShare?`<button class="btn accent block" id="sharebtn">Send (email / WhatsApp / Drive)</button>`:""}
    <a class="btn ${canShare?"":"accent"} block" style="margin-top:10px" href="${dl}" download="${esc(fname)}">Download file</a>
    ${isJob?`<p class="small muted" style="margin-top:10px">Send the file to ${BRAND.returnEmail?`<b>${esc(BRAND.returnEmail)}</b>`:"the office"}. Large packs are easier to send via WhatsApp, Google Drive or WeTransfer.</p>`:""}`;
  if(canShare) $("sharebtn").onclick=async()=>{ try{ await navigator.share({files:[file],title:fname,text:isJob?`Vehicle inspection – ${JOB.reg}`:""}); toast("Shared"); }catch(e){} };
}
function renderDone(){

}

}

/* ---------- ZIP (no compression – photos are already JPEG) ---------- */
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function dataToU8(d){ const b=atob(d.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const f of files){ const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const l=new DataView(new ArrayBuffer(30)); l.setUint32(0,0x04034b50,true); l.setUint16(4,20,true); l.setUint16(6,0x0800,true); l.setUint16(12,0x21,true); l.setUint32(14,crc,true); l.setUint32(18,sz,true); l.setUint32(22,sz,true); l.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(l.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm); off+=30+nm.length+sz; }
  const cs=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/zip"});
}

/* after-render hooks */
const _render=render;
render=function(){ _render(); const st=STEPS[S.step]; if(st&&st.kind==="defects") hydrateDefectThumbs(); };

/* start */
(async()=>{ applyBrand(); await DB.open(); route(); })();
